# Netlify 빌드 설정.
# Next.js 는 Netlify 가 자동 감지하므로 plugin / publish 경로는 지정하지 않는다.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# 공식 기준 URL (canonical · OG · sitemap · robots · JSON-LD)
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://ko-a-ra-homepage.netlify.app"
